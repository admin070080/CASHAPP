<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - CashApp</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { font-family: 'SF Pro Display', system-ui, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center">
    <div class="max-w-md w-full bg-white rounded-3xl shadow-xl p-8 md:p-10">
        
        <!-- Header -->
        <div class="text-center mb-8">
            <div class="w-16 h-16 bg-green-600 rounded-2xl mx-auto flex items-center justify-center text-white text-5xl font-bold mb-4">
                $
            </div>
            <h1 class="text-3xl font-bold text-gray-900">Forgot Password?</h1>
            <p class="text-gray-500 mt-3">
                No worries! Enter your registered email and we'll send you a reset link.
            </p>
        </div>

        <!-- Form -->
        <form id="forgotForm" class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Registered Email Address</label>
                <input type="email" id="email" 
                       class="w-full px-5 py-4 border border-gray-300 rounded-2xl focus:outline-none focus:border-green-500 transition"
                       placeholder="you@example.com" required>
            </div>

            <button type="submit"
                    class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-4 rounded-2xl transition text-lg">
                Send Reset Link
            </button>
        </form>

        <!-- Back to Login -->
        <div class="text-center mt-8">
            <a href="login.html" class="inline-flex items-center gap-2 text-green-600 hover:text-green-700 font-medium">
                <i class="fas fa-arrow-left"></i>
                Back to Login
            </a>
        </div>

    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();

            if (!email) {
                alert("Please enter your email address");
                return;
            }

            // Simulate sending reset email
            setTimeout(() => {
                alert(`✅ Password reset link has been sent to:\n${email}\n\n(For demo purposes, check the console)`);
                console.log(`🔗 Password reset email sent to: ${email}`);
                console.log(`Link: https://cashapp-mvp/reset-password?token=simulated-token-${Date.now()}`);
                
                // Redirect back to login after success
                setTimeout(() => {
                    window.location.href = "login.html";
                }, 2500);
            }, 800);
        });
    </script>
</body>
</html>
